# Checks every pull request to main. The logic lives in scripts/ci; this file only prepares the tools
# and calls those scripts, so moving to another CI only means rewriting this file (ADR-0055).
# The "verify" job is the check required by the "Protect main" rule: renaming it blocks merges.
name: pull-request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Tests need a successful build; the other checks run anyway, so one run shows every problem.
      - name: build
        id: build
        run: bash scripts/ci/build.sh
      - name: test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bash scripts/ci/test.sh
      - name: format
        if: ${{ !cancelled() }}
        run: bash scripts/ci/format.sh
      - name: frontend
        if: ${{ !cancelled() }}
        run: bash scripts/ci/frontend.sh
      - name: specs
        if: ${{ !cancelled() }}
        run: bash scripts/ci/specs.sh
      - name: spelling
        if: ${{ !cancelled() }}
        run: bash scripts/ci/spelling.sh
