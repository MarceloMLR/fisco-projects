# Publishes a version of the application in the production of the installation (ADR-0055, ADR-0125), only when someone
# starts it by hand, on the tag of the version (Actions, "Use workflow from": the tag v1.2.3). The GitHub environment
# "prod" accepts only the tags v* and waits for the approval of whoever operates the installation. The logic lives in
# scripts/cd; this file only prepares the tools and calls those scripts. Azure is reached by federation (OIDC): there
# are no secrets here. GitHub shows the values of the variables in the log of every step, and the logs are public: no
# personal value goes here (ADR-0116).
name: deploy-prod

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: prod
    env:
      ENVIRONMENT: prod
      PLAN_MUST_MATCH: "true"
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_operator_object_ids: ${{ vars.OPERATOR_OBJECT_IDS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: version
        run: bash scripts/cd/version.sh
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: plan
        run: bash scripts/cd/plan.sh
      - name: publish
        run: bash scripts/cd/publish.sh
      - name: migrate
        run: bash scripts/cd/migrate.sh
      - name: deploy
        run: bash scripts/cd/deploy.sh
